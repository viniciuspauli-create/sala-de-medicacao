<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E4A4F">
</head><body>
<title>Sala de Medicação</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: app de celular em pé — topo fixo (prescrição + objetivo), cena do jogo no meio, gaveta de materiais no rodapé do canvas. No computador, vira uma "moldura de celular" centralizada. */
:root{
  color-scheme:light;
  --bg:#D7EFEC; --bg-2:#C3E6E1; --surface:#FFFFFF; --surface-2:#F0F7F7; --ink:#0F3238; --muted:#557178; --line:#CDE1E2;
  --accent:#12A58C; --accent-dark:#0B7564; --accent-ink:#FFFFFF; --accent-soft:#D3F1EA;
  --blue:#2D7FD3; --blue-dark:#1F5EA3; --amber:#E8962A; --amber-soft:#FFEFD6;
  --ok:#1E9A55; --ok-soft:#DCF5E5; --warn:#C27A00; --warn-soft:#FFF0CF; --bad:#D9403A; --bad-soft:#FDE1DE; --star:#FFC43D;
  --hud:#0E4A4F; --rx:#FFFDF4;
  --f-display:'Baloo 2','Trebuchet MS',sans-serif; --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(circle at 20% 0%,#E9F8F5 0,transparent 45%),radial-gradient(circle at 100% 100%,var(--bg-2) 0,transparent 50%);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hud)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.05;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 8px}
@media (min-width:700px){#app{padding-block:16px;max-width:500px}}
body.playing .brand b{display:none}
body{margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding:8px 12px;margin-top:6px;background:var(--hud);color:#fff;border-radius:16px;box-shadow:0 4px 0 #082E31}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:#fff}
.brand svg{width:28px;height:28px}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:800;white-space:nowrap}
.top .sp{flex:1}
.pill{font-family:var(--f-display);font-size:15px;font-weight:700;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.14);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px;position:relative;white-space:nowrap}
.pill .st{color:var(--star)} .pill b{font-size:17px}
.ghost{background:var(--surface);border:0;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--line);color:var(--ink)}
.top .ghost{box-shadow:0 3px 0 #082E31;padding:6px 10px;font-size:13px}
.primary{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:12px 22px;font-weight:800;font-size:17px;box-shadow:0 4px 0 var(--accent-dark);font-family:var(--f-display)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dark)}
.primary.big{margin-top:16px;padding:14px 28px;font-size:19px;width:100%}
.primary.danger{background:var(--bad);box-shadow:0 4px 0 #8E2420}
.fly{position:absolute;right:4px;top:-8px;font-family:var(--f-display);font-weight:800;color:var(--star);font-size:20px;pointer-events:none;animation:fly 1s ease-out forwards;text-shadow:0 2px 0 #082E31}
.fly.neg{color:#FF8A84}
@keyframes fly{from{transform:translateY(0);opacity:1}to{transform:translateY(-30px);opacity:0}}
@keyframes pop{from{transform:scale(.94)}to{transform:none}}

/* início */
.hero{padding-block:22px 6px}
.hero h1{font-size:clamp(38px,11vw,54px)}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);font-size:16px;margin:10px 0 0}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:14px;font-weight:700;color:var(--amber)}
.sec-l{font-family:var(--f-display);font-weight:800;font-size:18px;margin:20px 0 8px}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{text-align:left;background:var(--surface);border:2px solid transparent;border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 0 var(--line)}
.mode.on{border-color:var(--accent);background:var(--accent-soft)}
.mode:disabled{opacity:.55;cursor:not-allowed}
.mode .ic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft)}
.mode .ic svg{width:42px;height:42px}
.mode div{min-width:0}
.mode h3{font-size:22px}
.mode small{color:var(--muted);font-size:14px;display:block;line-height:1.3}
.mode .tag{font-weight:800;font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:.06em}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl{background:var(--surface);border:2px solid transparent;border-radius:14px;padding:10px 8px;text-align:center;box-shadow:0 3px 0 var(--line);min-width:0}
.lvl b{display:block;font-family:var(--f-display);font-size:18px}
.lvl small{display:block;color:var(--muted);font-size:12px;line-height:1.25}
.lvl.on{border-color:var(--blue);background:#E3EEFB}

/* jogo */
#gamewrap{display:flex;flex-direction:column;gap:8px;margin-top:8px;flex:1;min-height:0}
.rxs{display:flex;align-items:center;gap:10px;background:var(--rx);border-radius:12px;padding:8px 10px;box-shadow:0 3px 0 #E5DCC4;text-align:left;border:0;width:100%}
.rxs .rxic{flex:none;width:34px;height:34px;border-radius:9px;background:var(--amber);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px}
.rxs .rxt{min-width:0;flex:1}
.rxs .rxp{font-weight:800;font-size:13.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rxs .rxl{font-family:var(--f-mono);font-size:12.5px;line-height:1.3;color:#5B4A1E}
.rxs .more{color:var(--muted);font-size:20px}
.obj{background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:0 3px 0 var(--line);display:flex;gap:10px;align-items:flex-start}
.obj .num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;box-shadow:inset 0 -3px 0 var(--blue-dark)}
.obj .txt{flex:1;min-width:0}
.obj .ph{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--amber)}
.obj .tt{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.1}
.obj .how{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.3}
.obj .rbtn{flex:none;background:var(--surface-2);border:0;border-radius:10px;padding:6px 8px;font-weight:800;font-size:12px;box-shadow:0 2px 0 var(--line)}
.obj.flash{animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
.gstage{position:relative;flex:1;min-height:420px;border-radius:16px;overflow:hidden;background:#CDEAE5;box-shadow:0 4px 0 var(--line)}
#game{position:absolute;inset:0}
#game canvas{display:block;touch-action:none}
#gToast{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:4}
.gt{background:rgba(15,50,56,.93);color:#fff;padding:7px 12px;border-radius:12px;font-weight:700;font-size:13.5px;line-height:1.3;text-align:center;animation:pop .3s cubic-bezier(.3,1.6,.6,1);transition:opacity .4s;box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:100%}
.gt.ok{background:rgba(30,154,85,.95)} .gt.warn{background:rgba(194,122,0,.96)} .gt.bad{background:rgba(217,64,58,.96)} .gt.out{opacity:0}

/* roteiro (bottom sheet) */
#sheet{position:fixed;inset:0;z-index:30;background:rgba(10,40,44,.45);display:flex;align-items:flex-end;justify-content:center}
.sbox{background:var(--surface);width:100%;max-width:480px;max-height:80vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sbox h2{font-size:26px;margin-bottom:6px}
.fase{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--amber);margin:12px 0 4px}
.stp{display:flex;gap:10px;align-items:flex-start;padding:6px 0;color:var(--muted);font-weight:700;font-size:15px}
.stp i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-weight:800;font-size:14px;box-shadow:inset 0 -2px 0 var(--line)}
.stp.done{color:var(--ink)} .stp.done i{background:var(--accent);color:#fff;box-shadow:none}
.stp.now{color:var(--ink)} .stp.now i{background:var(--blue);color:#fff;box-shadow:none}
.stp small{display:block;font-weight:600;color:var(--muted);font-size:13px}

/* modal e cartões */
#modal{position:fixed;inset:0;z-index:40;background:rgba(10,40,44,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) max(14px,env(safe-area-inset-right,0px)) 20px max(14px,env(safe-area-inset-left,0px));overflow:auto}
.mbox{background:var(--surface);border-radius:20px;max-width:460px;width:100%;padding:18px;box-shadow:0 6px 0 var(--line);animation:pop .3s}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.mhead h2{font-size:26px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rx{background:var(--rx);border-radius:6px;padding:14px;font-family:var(--f-mono);font-size:13.5px;line-height:1.55;box-shadow:0 4px 0 #E5DCC4}
.rx h4{margin:0 0 8px;font-family:var(--f-display);font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px dashed #DCCFA8;padding-bottom:6px}
.rx .item{margin-top:10px;padding:8px 10px;background:var(--amber-soft);border-left:4px solid var(--amber);font-weight:500;border-radius:3px}
.rx dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px} .rx dt{color:var(--muted)} .rx dd{margin:0}
.pulseira{display:flex;align-items:stretch;border-radius:40px;background:linear-gradient(#FFFFFF,#E8F1F4);overflow:hidden;margin:6px 0 14px;box-shadow:0 4px 0 #C4D6DB}
.pulseira .clip{width:30px;background:linear-gradient(var(--blue),var(--blue-dark))}
.pulseira .pin{padding:10px 14px;font-family:var(--f-mono);font-size:13px;flex:1;min-width:0}
.pulseira .pin b{font-family:var(--f-body);font-size:16px;display:block;font-weight:800}
.alg{display:inline-block;margin-top:4px;font-weight:800;padding:1px 9px;border-radius:999px;font-family:var(--f-body);font-size:13px}
.alg.yes{background:var(--bad);color:#fff} .alg.no{background:var(--ok-soft);color:var(--ok)}
.unit{color:var(--muted);font-size:14px;font-weight:600}
.tbl-wrap{overflow-x:auto}
.ptbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:460px}
.ptbl th{font-family:var(--f-display);font-size:15px;text-transform:uppercase;background:var(--accent);color:#fff;padding:7px 8px;text-align:left}
.ptbl th.sec{background:var(--hud)}
.ptbl td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top;width:50%}
.ptbl td b{display:block} .ptbl td em{display:block;color:var(--muted);font-size:12px;font-style:normal}
.sum{background:var(--surface);border-radius:22px;padding:20px;margin-top:14px;box-shadow:0 5px 0 var(--line)}
.sum table{width:100%;border-collapse:collapse;font-size:14.5px}
.sum td{padding:8px 4px;border-bottom:2px solid var(--surface-2);font-weight:600}
.sum td.n{text-align:right;font-family:var(--f-display);font-weight:800;font-size:18px;white-space:nowrap}
.rev{margin:10px 0 0;padding-left:18px;font-size:14.5px} .rev li{margin:4px 0}
li.ok::marker{color:var(--ok)} li.warn::marker{color:var(--warn)} li.bad::marker{color:var(--bad)}
.stars{letter-spacing:2px;white-space:nowrap} .stars .on{color:var(--star);text-shadow:0 2px 0 #D49A10} .stars .off{color:#D6E0E1}
.bigstars{font-size:42px}
.score-big{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,20vw,100px);line-height:1;color:var(--accent)}
.foot{margin-top:24px;font-size:12px;color:var(--muted)}
body.playing #app{height:100dvh;min-height:0}
body.playing #gamewrap{flex:1;min-height:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header class="top">
    <button class="brand" id="homeBtn" aria-label="Início"><svg viewBox="0 0 34 34" aria-hidden="true"><rect x="8" y="2" width="18" height="22" rx="6" fill="#CFE6FA" stroke="#fff" stroke-width="2"/><rect x="11" y="10" width="12" height="7" rx="2" fill="#fff"/><path d="M17 24 V32" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg><b>Sala de Medicação</b></button>
    <span class="sp"></span>
    <span class="pill" id="casePill" hidden></span>
    <span class="pill" id="ptsPill"><span class="st">★</span><b id="pts">0</b></span>
    <button class="ghost" id="protoBtn">Tabela</button>
  </header>
  <main id="view"></main>
  <section id="gamewrap" hidden>
    <button class="rxs" id="rxStrip" aria-label="Abrir prescrição completa"></button>
    <div class="obj" id="objCard"></div>
    <div class="gstage"><div id="game"></div><div id="gToast" aria-live="polite"></div></div>
  </section>
  <div id="sheet" hidden></div>
  <div id="modal" hidden></div>
</div>

<script>
/* ---------- DADOS (transcritos da tabela da unidade) ---------- */
const D = {
  dipirona:{nome:'Dipirona',apres:'ampola',ev:{dil:'ABD',vol:20},im:{dil:'nenhum'},dose:'1 g (2 ml)',volIM:2,alergia:'Dipirona'},

  dexametasona:{nome:'Dexametasona',apres:'ampola',ev:{dil:'ABD',vol:20},im:{dil:'nenhum'},dose:'10 mg (2,5 ml)',volIM:2.5},
  metoclopramida:{nome:'Metoclopramida',apres:'ampola',ev:{dil:'ABD',vol:20},im:{dil:'nenhum'},dose:'10 mg (2 ml)',volIM:2},
  ceftriaxona:{nome:'Ceftriaxona',apres:'frasco',ev:{dil:'ABD',vol:20},im:{dil:'proprio'},dose:'1 g',volIM:3.5,

  diazepam:{nome:'Diazepam',apres:'ampola',ev:{dil:'nenhum'},im:{dil:'nenhum'},dose:'10 mg (2 ml)',volIM:2,
    evNota:'Não é recomendado diluir o diazepam: pode precipitar (solução leitosa) e a diluição predispõe a tromboflebite.'},
  tiamina:{nome:'Tiamina',apres:'ampola',ev:{dil:'SF',vol:100,tempo:30},im:{dil:'nenhum'},dose:'100 mg (1 ml)',volIM:1},
  tiaminab12:{nome:'Tiamina + Complexo B12',apres:'ampola',ev:{dil:'SF',vol:250,tempo:60},dose:'3 amp. de tiamina + 1 amp. de complexo B12',
    evNota:'3 ampolas de tiamina + 1 ampola de complexo B12 em SF. Atente à prescrição médica para o volume.'},
  complexob12:{nome:'Complexo B12',apres:'ampola',im:{dil:'nenhum'},dose:'1 ampola (2 ml)',volIM:2},

    imNota:'Benzetacil: somente intramuscular.'}
};
const ROWS=[['dipirona','dipirona'],['tenoxicam','tenoxicam'],['dexametasona','dexametasona'],['metoclopramida','metoclopramida'],['ceftriaxona','ceftriaxona'],['hidrocortisona','hidrocortisona'],['biperideno','biperideno'],['furosemida','furosemida'],['escopolamina','escopolamina'],['tramadol','tramadol'],['diazepam','diazepam'],['tiamina','tiamina'],['tiaminab12','complexob12']];
const ROWS2=[['azitromicina','prometazina'],['amoxclav','benzetacil']];
const EV_SER=['dipirona','tenoxicam','dexametasona','metoclopramida','ceftriaxona','biperideno','furosemida','diazepam'];
const EV_BOL=['hidrocortisona','escopolamina','tramadol','tiamina','tiaminab12','azitromicina','amoxclav'];
const IMS=['dipirona','tenoxicam','dexametasona','metoclopramida','ceftriaxona','hidrocortisona','biperideno','furosemida','escopolamina','tramadol','diazepam','tiamina','complexob12','prometazina','benzetacil'];
const SOROS=[
  {sol:'SF 0,9%',vol:500,min:240,eq:'macro'},{sol:'SG 5%',vol:500,min:360,eq:'macro'},
  {sol:'Ringer lactato',vol:1000,min:480,eq:'macro'},{sol:'SF 0,9%',vol:1000,min:720,eq:'macro'},
  {sol:'SF 0,9%',vol:250,min:120,eq:'micro'},{sol:'SG 5%',vol:100,min:60,eq:'micro'},{sol:'Ringer lactato',vol:500,min:120,eq:'macro'}
];
const PAC=[
  {n:'Maria Aparecida Souza',alt:'Maria Aparecida Santos',nasc:'12/03/1958'},
  {n:'José Carlos Lima',alt:'José Carlos Lins',nasc:'04/09/1971'},
  {n:'Ana Beatriz Ramos',alt:'Ana Beatriz Rocha',nasc:'27/11/1990'},
  {n:'Antônio Ferreira da Silva',alt:'Antônio Pereira da Silva',nasc:'15/06/1949'},
  {n:'Francisca de Oliveira Mota',alt:'Francisca de Oliveira Motta',nasc:'08/01/1983'},
  {n:'Luiz Fernando Costa',alt:'Luiz Fernando Coutinho',nasc:'30/07/1966'},
  {n:'Juliana Martins Rocha',alt:'Juliana Martins Rosa',nasc:'19/02/1995'},

];

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=n=>String(n).replace('.',',');
const tempoTxt=m=>m>=60?`${fmt(m/60)} h`:`${m} min`;

  switch(s.dil){
    case 'nenhum': return 'Somente a ampola – sem diluir';
    case 'ABD': return `Diluir em ${s.vol} ml de ABD`+(s.final?` – volume final ${s.final} ml`:'');
    case 'SF': return `Diluir em ${s.vol} ml de SF 0,9%`;
    case 'ABD+SF': return `Diluir em ${s.vol} ml de ABD + ${s.bolsa} ml de SF 0,9%`;

/* ---------- casos ---------- */
function makeCase(tipo){
  const p=makePatient(), leito=String(1+Math.floor(Math.random()*24)).padStart(2,'0');
  const c={tipo,p,leito,hora:pick(['08:00','10:00','14:00','16:00','20:00','22:00'])};
  if(tipo==='soro'){ c.soro=pick(SOROS); c.inf={vol:c.soro.vol,min:c.soro.min,eq:c.soro.eq}; c.via='EV'; }
  else{
    c.key=pick(tipo==='im'?IMS:tipo==='ev_ser'?EV_SER:EV_BOL); c.d=D[c.key];
    c.via=tipo==='im'?'IM':'EV'; c.spec=tipo==='im'?c.d.im:c.d.ev;
    if(tipo==='ev_bol') c.inf={vol:c.spec.volInf||c.spec.vol,min:c.spec.tempo,eq:'macro'};
  }
  c.queixa=tipo==='soro'?pick(QUEIXA_SORO):(QUEIXA[c.key]||'');
  const r=Math.random();
  c.issue = r<.1 ? 'nome' : (r<.2 && tipo!=='soro') ? 'alergia' : null;
  c.alergia = c.issue==='alergia' ? (c.d.alergia||c.d.nome) : null;
  return c;
}
function rxLine(c){
  if(c.tipo==='soro') return `${c.soro.sol} ${c.soro.vol} ml — EV — correr em ${tempoTxt(c.soro.min)} — equipo de ${c.soro.eq==='macro'?'macrogotas':'microgotas'}`;
  if(c.tipo==='ev_ser') return `${c.d.nome} ${c.d.dose} — EV — agora`;
  if(c.tipo==='ev_bol') return `${c.d.nome} ${c.d.dose}${c.key==='tiaminab12'?' em SF 0,9% 250 ml':''} — EV — correr em ${tempoTxt(c.spec.tempo)}`;
  return `${c.d.nome} ${c.d.dose} — IM — agora (volume a aplicar: ${fmt(c.d.volIM)} ml)`;
}

/* ---------- tabela de preparo ---------- */
function cell(k,via){ if(!k) return '<td></td>'; const d=D[k],s=via==='ev'?d.ev:d.im; if(!s) return '<td></td>';
  const nota=via==='ev'?d.evNota:d.imNota;
  return `<td><b>${d.nome} <span style="font-weight:400;color:var(--muted)">(${d.apres})</span></b>${descr(s)}${nota&&!/somente (endo|intra)/i.test(nota)?`<em>${nota}</em>`:''}</td>`;}
function protoTable(){
  return `<div class="tbl-wrap"><table class="ptbl"><tr><th>Endovenosa</th><th>Intramuscular</th></tr>
   ${ROWS.map(([a,b])=>`<tr>${cell(a,'ev')}${cell(b,'im')}</tr>`).join('')}
   <tr><th class="sec">Somente endovenosa</th><th class="sec">Somente intramuscular</th></tr>
   ${ROWS2.map(([a,b])=>`<tr>${cell(a,'ev')}${cell(b,'im')}</tr>`).join('')}</table></div>`;
}

function evalSite(site,c){
  const v=c.d.volIM, ben=c.key==='benzetacil';
  if(ben){ if(site==='ventro') return [15,{ok:true,t:'Correto: penicilina benzatina vai na região glútea, com preferência pela ventroglútea.'}];
    if(site==='dorso') return [12,{ok:'warn',t:'Aceitável para penicilina benzatina, no quadrante superior externo. A ventroglútea é a preferencial.'}];
    return [0,{ok:false,t:'Penicilina benzatina (4 ml, suspensão viscosa) deve ser aplicada na região glútea, preferencialmente a ventroglútea.'}]; }
  if(site==='ventro') return [15,{ok:true,t:`Ventroglúteo: local mais seguro, longe de grandes vasos e nervos. Comporta os ${fmt(v)} ml.`}];
  if(site==='deltoide') return v<=2?[15,{ok:true,t:`Deltoide comporta até 2 ml em adultos; ${fmt(v)} ml está dentro do limite.`}]:[0,{ok:false,t:`O deltoide comporta até 2 ml em adultos. Para ${fmt(v)} ml, use ventroglúteo, dorsoglúteo ou vasto lateral.`}];
  if(site==='dorso') return [12,{ok:'warn',t:'Dorsoglúteo é aceito, mas somente no quadrante superior externo, pelo risco de lesão do nervo ciático. O ventroglúteo é preferível.'}];
  if(site==='vasto') return v<=4?[13,{ok:'warn',t:`Vasto lateral é uma boa opção para até 4 ml. O ventroglúteo segue como primeira escolha.`}]:[5,{ok:false,t:`${fmt(v)} ml é volume alto para o vasto lateral. Prefira a região ventroglútea.`}];
}

function svgTex(scene,key,[w,h,inner]){
  if(scene.textures.exists(key)) return Promise.resolve();
  return new Promise(res=>{const img=new Image();
    img.onload=()=>{if(!scene.textures.exists(key))scene.textures.addImage(key,img);res();};
    img.onerror=()=>{console.warn('textura falhou',key);res();};
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${DEFS}${inner}</svg>`);});
}

function button(s,x,y,label,cb,{w=210,h=50,color=0x12A58C,dark=0x0B7564,size=19}={}){

/* caminho SVG -> pontos (para colisão) */
let _hsvg=null;
function samplePath(d,step,fx){
  if(!_hsvg){_hsvg=document.createElementNS('http://www.w3.org/2000/svg','svg');_hsvg.setAttribute('width','0');_hsvg.setAttribute('height','0');_hsvg.style.position='absolute';document.body.appendChild(_hsvg);}
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);_hsvg.appendChild(p);
  const L=p.getTotalLength(),pts=[];for(let l=0;l<=L;l+=step){const q=p.getPointAtLength(l);pts.push(fx(q.x,q.y));}p.remove();return pts;
}
function distToPolyline(x,y,pts){let m=1e9;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy||1;let t=((x-a.x)*dx+(y-a.y)*dy)/l2;t=Math.max(0,Math.min(1,t));const px=a.x+t*dx,py=a.y+t*dy;m=Math.min(m,Math.hypot(x-px,y-py));}return m;}

  g.fillStyle(0xF2F9FD,.95);g.fillRoundedRect(x0,y0,L,D,3*k);
  const f=Math.min(1,vol/cap)*L;
  if(f>0){g.fillStyle(liq,.8);g.fillRect(x0+1.5*k,y0+1.5*k,Math.max(0,f-1.5*k),D-3*k);}
  g.lineStyle(Math.max(1,k*.8),0x6F8FA3,1);for(let i=1;i<10;i++){const x=x0+i*L/10;g.lineBetween(x,y0,x,y0+(i%5?D*.32:D*.55));}
  g.lineStyle(Math.max(1.5,k),0x8FB0C2,1);g.strokeRoundedRect(x0,y0,L,D,3*k);
  const sx=x0+f;g.fillStyle(0x3E444A,1);g.fillRect(sx,y0+1,5*k,D-2);
  g.fillStyle(0xC2CED6,1);g.fillRect(sx+5*k,-D*.17,L+6*k,D*.34);

    g.fillStyle(skd,1);g.fillRect(-r*.18,r*.35,r*.36,r*.4);
    g.fillStyle(sk,1);g.fillEllipse(-r*.56,r*.0,r*.2,r*.3);g.fillEllipse(r*.56,r*.0,r*.2,r*.3);
    g.fillEllipse(0,-r*.02,r*1.1,r*1.28);
    g.fillStyle(hair,1);
    if(p.cab>=5&&!p.cabLongo){g.fillEllipse(-r*.5,-r*.22,r*.22,r*.42);g.fillEllipse(r*.5,-r*.22,r*.22,r*.42);}
    else{g.slice(0,-r*.12,r*.58,Math.PI*1.02,Math.PI*1.98,false);g.fillPath();g.fillEllipse(0,-r*.5,r*1.1,r*.42);}
    if(p.barba){g.fillStyle(hair,.85);g.slice(0,r*.1,r*.52,Math.PI*.05,Math.PI*.95,false);g.fillPath();}
    const pain=c.mood==='pain';
    g.lineStyle(3,0x2A1A10,1);
    if(pain){g.lineBetween(-r*.32,-r*.06,-r*.12,-r*.0);g.lineBetween(r*.32,-r*.06,r*.12,-r*.0);}
    else{g.fillStyle(0x2A1A10,1);g.fillCircle(-r*.22,-r*.02,r*.07);g.fillCircle(r*.22,-r*.02,r*.07);}
    g.lineStyle(3,ln,1);g.lineBetween(-r*.34,-r*.2+(pain?.06*r:0),-r*.1,-r*.22);g.lineBetween(r*.34,-r*.2+(pain?.06*r:0),r*.1,-r*.22);
    if(p.oculos){g.lineStyle(2.5,0x334,1);g.strokeCircle(-r*.22,-r*.02,r*.17);g.strokeCircle(r*.22,-r*.02,r*.17);g.lineBetween(-r*.05,-r*.04,r*.05,-r*.04);}
    g.lineStyle(3,0x8A3A2E,1);g.beginPath();
    if(pain){g.arc(0,r*.42,r*.18,Math.PI*1.15,Math.PI*1.85,false);}else{g.arc(0,r*.18,r*.18,Math.PI*.2,Math.PI*.8,false);}
    g.strokePath();
    if(p.idade>=65){g.lineStyle(1.5,ln,.6);g.lineBetween(-r*.42,r*.12,-r*.34,r*.2);g.lineBetween(r*.42,r*.12,r*.34,r*.2);}
    if(pain){g.fillStyle(0x7FC4F0,1);g.fillCircle(r*.5,-r*.35,r*.07);}
  };
  c.setMood=m=>{c.mood=m;c.redraw();}; c.redraw(); return c;
}

/* ---------- HUD em HTML sobre o canvas ---------- */
let CUR=null;
function hud(stage,obj){$('#gStage').textContent=stage;$('#gObj').innerHTML=obj;}
function toast(msg,kind='info'){const d=document.createElement('div');d.className='gt '+kind;d.innerHTML=msg;$('#gToast').appendChild(d);setTimeout(()=>d.classList.add('out'),3600);setTimeout(()=>d.remove(),4100);}
function note(R,kind,t,pts=0,key){
  R.keys=R.keys||{}; if(key){if(R.keys[key])return false;R.keys[key]=1;}
  R.notes.push({ok:kind,t,pts}); if(pts){R.ded+=pts;setScore(pts);}
  if(kind!==true&&pts) toast(t,kind==='warn'?'warn':'bad'); return true;
}
function caseScore(R){return Math.max(0,100+R.ded);}
function setScore(delta){
  $('#pts').textContent=CUR?caseScore(CUR.R):S.score;
  if(delta){const f=document.createElement('span');f.className='fly'+(delta<0?' neg':'');f.textContent=(delta>0?'+':'')+delta;$('#ptsPill').appendChild(f);setTimeout(()=>f.remove(),1000);}
}
function modal(html,{wide=false}={}){const m=$('#modal');m.hidden=false;m.innerHTML=`<div class="mbox" style="${wide?'':'max-width:520px'}">${html}</div>`;return m;}

/* ---------- arrastáveis com posição de origem ---------- */
function draggable(s,obj,{home=true}={}){
  obj.setInteractive({draggable:true,useHandCursor:true});
  obj.homeX=obj.x;obj.homeY=obj.y;obj.moved=false;
  obj.on('pointerdown',()=>{obj.moved=false;});
  obj.on('dragstart',()=>{obj.setDepth(60);obj.onDragStart&&obj.onDragStart();});
  obj.on('drag',(p,x,y)=>{obj.x=x;obj.y=y;obj.moved=true;obj.onDrag&&obj.onDrag(p);});
  obj.on('dragend',p=>{obj.setDepth(obj.baseDepth||10);const keep=obj.onDrop?obj.onDrop(p):false;if(!keep&&home&&obj.active)s.tweens.add({targets:obj,x:obj.homeX,y:obj.homeY,duration:260,ease:'Back.Out'});});
  obj.on('pointerup',()=>{if(!obj.moved&&obj.onTap)obj.onTap();});
  return obj;
}
function goHome(s,obj){s.tweens.add({targets:obj,x:obj.homeX,y:obj.homeY,duration:260,ease:'Back.Out'});}

  C.add(T(s,640,155,`Aspirar de ${srcName}`,28,'#0F3238',{display:true}));
  C.add(T(s,640,215,`Disponível: ${fmt(Math.round(maxMl*10)/10)} ml para esta seringa de ${cap} ml · arraste o êmbolo`,16,'#557178',{w:'700'}));

  let v=0; const base=syr.it.vol;
  const reading=T(s,640,450,'',30,'#2D7FD3',{display:true});C.add(reading);
  const sub=T(s,640,482,'',15,'#557178');C.add(sub);
  const liq=syr.it.drugMl()>0?LIQ_DRUG:LIQ_DIL;
  const draw=()=>{drawSyr(g,cap,base+v,syr.it.needle,v>0&&srcName.match(/ABD|kit/i)&&!syr.it.drugMl()?LIQ_DIL:liq,k);reading.setText(`+ ${fmt(Math.round(v*10)/10)} ml`);sub.setText(`Total na seringa: ${fmt(Math.round((base+v)*10)/10)} ml`);
    knob.x=x0+(base+v)/cap*L+5*k+L+6*k+3.5*k;};
  const knob=s.add.circle(0,y,30,0x2D7FD3,.25).setStrokeStyle(4,0x2D7FD3);C.add(knob);
  const hand=T(s,0,y-60,'⇠ puxe ⇢',14,'#2D7FD3');C.add(hand);

  knob.on('drag',(p,x)=>{const raw=(x-(5*k+L+6*k+3.5*k)-x0)/L*cap-base;v=Math.max(0,Math.min(maxMl,Math.round(raw/step)*step));draw();hand.x=knob.x;});
  draw();hand.x=knob.x;
  const close=()=>C.destroy();

}

/* ---------- MINIGAME: injetar devagar (empurrar o êmbolo) ---------- */
function injectPanel(s,{cap,vol,needle,im,face,p},cb){
  const C=s.add.container(0,0).setDepth(1000);

  const k=Math.min(4,520/SYR[cap][0]);
  const g=s.add.graphics();g.x=560;g.y=330;g.scaleX=-1;C.add(g);
  const tg=s.add.graphics();C.add(tg);
  const L=SYR[cap][0]*k, tipX=560+L/2+(needle?NEEDLES[needle].len*2.2*k*.35:0)+20;

  const fc=drawFace(s,1060,210,p,46);C.add(fc);
  // medidor
  const mx=330,mw=620,my=500; const mg=s.add.graphics();C.add(mg);
  const zones=[[0,.35,0x1E9A55,'Lento'],[.35,.65,0xE8962A,'Médio'],[.65,1,0xD9403A,'Rápido']];
  zones.forEach(([a,b,col,l])=>{mg.fillStyle(col,.9);mg.fillRect(mx+a*mw,my,(b-a)*mw,26);C.add(T(s,mx+(a+b)/2*mw,my+13,l,15,'#fff'));});
  const mk=s.add.triangle(mx,my-10,0,0,20,0,10,16,0x0F3238);C.add(mk);
  const info=T(s,640,560,'',15,'#557178');C.add(info);
  const goodMax=im?.3:.2; // fração por segundo considerada lenta
  let prog=0,fast=0,drag=false,lastX=0,hist=[[performance.now(),0]];
  const draw=()=>{drawSyr(g,cap,vol*(1-prog),needle,LIQ_DRUG,k);};draw();
  const zone=s.add.rectangle(640,330,1000,220,0,0).setInteractive({useHandCursor:true});C.add(zone);
  zone.on('pointerdown',pp=>{drag=true;lastX=pp.x;});
  const up=()=>{drag=false;}; s.input.on('pointerup',up);
  const mv=pp=>{if(!drag||prog>=1)return;const dx=pp.x-lastX;lastX=pp.x;if(dx<=0)return;const dp=dx/(L*1.0);const now=performance.now();
    const sp=speed(now);prog=Math.min(1,prog+dp);if(sp>goodMax*1.15)fast+=dp;hist.push([now,prog]);draw();
    if(prog>=1)finish();};
  s.input.on('pointermove',mv);
  function speed(now){while(hist.length>2&&now-hist[0][0]>600)hist.shift();const [t0,p0]=hist[0];return (prog-p0)/Math.max(.15,(now-t0)/1000);}
  const tick=s.time.addEvent({delay:80,loop:true,callback:()=>{const sp=speed(performance.now());const pos=Math.min(1,sp/(goodMax*3));mk.x=mx+pos*mw;

  function finish(){tick.remove();s.input.off('pointermove',mv);s.input.off('pointerup',up);
    s.time.delayedCall(400,()=>{C.destroy();cb(Math.max(0,1-fast));});}
  return C;
}

    ng.fillStyle(0xF4FAFD,1);ng.fillRoundedRect(-194*kk,-8*kk,34*kk,16*kk,4);ng.lineStyle(2,0x9FBFD0,1);ng.strokeRoundedRect(-194*kk,-8*kk,34*kk,16*kk,4);
    if(flash){ng.fillStyle(0xC8202A,1);ng.fillRoundedRect(-190*kk,-4*kk,26*kk,8*kk,2);}
    cath.rotation=ang*Math.PI/180;inner.x=adv*K;};

  angT.setText(`Ângulo: ${ang}°`);
  const bev=button(s,500,600,'Bisel: para cima',()=>{if(state!=='aim')return;up=!up;bev.setLabel(up?'Bisel: para cima':'Bisel: para baixo');drawC();},{w:220,color:0x557178,dark:0x3A4E53,size:17});C.add(bev);
  const go=button(s,780,600,'Segure para avançar',null,{w:280,color:0x2D7FD3,dark:0x1F5EA3,size:18});C.add(go);
  go.on('pointerdown',()=>{if(state==='aim')state='adv';if(state==='adv')hold=true;});
  const rel=()=>{if(!hold)return;hold=false;if(state!=='adv')return;const t=tip();if(inV(t)){end(true,'ok');}};
  go.on('pointerup',rel);go.on('pointerout',rel);s.input.on('pointerup',rel);
  const tip=()=>{const a=ang*Math.PI/180;return {u:170+adv*Math.cos(a),v:70+adv*Math.sin(a)};};

/* ---------- roteiro de passos ---------- */
class Guide{
  constructor(scene,steps){this.s=scene;this.steps=steps.map(([f,id,t,how,view])=>({f,id,t,how,view}));this.done=new Set();this.render();}
  cur(){return this.steps.find(x=>!this.done.has(x.id));}
  idx(id){return this.steps.findIndex(x=>x.id===id);}
  can(id){const c=this.cur();if(!c||this.done.has(id)||c.id===id)return true;
    if(LEVEL==='treino'&&this.idx(id)>this.idx(c.id)){toast(`Primeiro: ${c.t}.`,'warn');this.bump();return false;}return true;}
  complete(id){if(this.done.has(id))return;const c=this.cur();
    if(LEVEL!=='treino'&&c&&c.id!==id&&this.idx(id)>this.idx(c.id))note(CUR.R,'warn',`Fora de ordem: "${this.steps[this.idx(id)].t}" antes de "${c.t}".`,-2,'ord_'+id);
    this.done.add(id);this.render(true);const n=this.cur();if(n&&LEVEL==='treino'&&n.view&&this.s.goView)this.s.goView(n.view);}
  bump(){const c=$('#objCard');c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash');}
  render(flash){const c=this.cur(),card=$('#objCard'),N=this.steps.length,n=c?this.idx(c.id)+1:N;
    if(LEVEL==='prova')card.innerHTML=`<div class="num">?</div><div class="txt"><div class="ph">Modo prova</div><div class="tt">Sem roteiro</div><div class="how">Faça o procedimento completo, como no plantão.</div></div>`;
    else if(LEVEL==='pratica')card.innerHTML=`<div class="num">${this.done.size}</div><div class="txt"><div class="ph">Fase atual · ${this.done.size} de ${N} passos</div><div class="tt">${c?FASES[c.f]:'Concluído'}</div><div class="how">Você sabe o que vem agora?</div></div>`;
    else card.innerHTML=`<div class="num">${n}</div><div class="txt"><div class="ph">Passo ${n} de ${N} · ${c?FASES[c.f]:'fim'}</div><div class="tt">${c?c.t:'Tudo pronto'}</div><div class="how">${c?c.how:''}</div></div><button class="rbtn" id="rbtn">Roteiro</button>`;
    const rb=$('#rbtn');if(rb)rb.onclick=()=>this.sheet();if(flash)this.bump();}
  sheet(){const c=this.cur();let html='',last='';
    this.steps.forEach((x,i)=>{if(x.f!==last){html+=`<div class="fase">${FASES[x.f]}</div>`;last=x.f;}
      const st=this.done.has(x.id)?'done':c&&c.id===x.id?'now':'';html+=`<div class="stp ${st}"><i>${this.done.has(x.id)?'✓':i+1}</i><div>${x.t}${st==='now'?`<small>${x.how}</small>`:''}</div></div>`;});
    const sh=$('#sheet');sh.hidden=false;sh.innerHTML=`<div class="sbox"><div class="mhead"><h2>Roteiro</h2><button class="ghost" id="shx">Fechar</button></div>${html}</div>`;
    $('#shx').onclick=()=>{sh.hidden=true;};sh.onclick=e=>{if(e.target===sh)sh.hidden=true;};}
}

  const out={};
  items.forEach((it,i)=>{const row=i<5?0:1,col=row?i-5:i;const x=74+col*143,y=DRAWER_Y+(row?163:56);
    const bg=s.add.graphics().setScrollFactor(0).setDepth(81);

    draw(false);C.setInteractive({useHandCursor:true});

    out[it.key]={C,draw,disable(){C.off=true;C.setAlpha(.3);draw(false);},enable(){C.off=false;C.setAlpha(1);},x,y};

  return out;
}

  else if(r<.32&&c.d){c.issue='alergia';c.alergiaW=c.d.alergia||c.d.nome;}

    <table>${S.results.map((r,i)=>`<tr><td>Caso ${i+1}: ${r.c.p.n}</td><td class="n">${caseScore(r)}</td></tr>`).join('')}</table>
    ${rev.length?`<h3 style="margin-top:14px;font-size:20px">Erros para estudar</h3><ul class="rev">${rev.map(t=>`<li class="bad">${t}</li>`).join('')}</ul>`:''}
    <button class="primary big" id="again">Jogar de novo</button><button class="ghost" id="hm" style="margin-top:12px;width:100%">Voltar ao início</button></div>`);
  $('#again').onclick=()=>startMode(S.mode);$('#hm').onclick=home;}
const ICON={soro:`<svg viewBox="0 0 52 52"><rect x="12" y="4" width="28" height="30" rx="8" fill="#EAF5FB" stroke="#8FB0C2" stroke-width="2"/><rect x="15" y="14" width="22" height="17" rx="5" fill="#9CC4EC"/><rect x="23" y="34" width="6" height="6" fill="#B7C4CC"/><circle cx="26" cy="45" r="4" fill="#2D7FD3"/></svg>`,
  ev:`<svg viewBox="0 0 52 52"><rect x="4" y="18" width="44" height="18" rx="9" fill="#EDB792"/><path d="M28,24 L36,25 L36,29 L28,30 Z" fill="#E58BA7"/><rect x="36" y="25" width="8" height="4" fill="#fff"/></svg>`,
  im:`<svg viewBox="0 0 52 52"><g transform="rotate(-45 26 26)"><rect x="12" y="20" width="26" height="12" rx="3" fill="#EAF5FB" stroke="#8FB0C2" stroke-width="2"/><rect x="14" y="22" width="14" height="8" fill="#F0A848"/><rect x="38" y="23" width="8" height="6" fill="#B7C4CC"/><line x1="2" y1="26" x2="12" y2="26" stroke="#8E9CA6" stroke-width="2.5"/></g></svg>`};
function home(){S.run++;CUR=null;$('#casePill').hidden=true;$('#pts').textContent='0';
  showView(`<section class="hero"><p class="eyebrow">Simulador · técnico de enfermagem</p><h1>Prepare, puncione, <span>administre.</span></h1>
    <p>Confira o paciente, monte o material, puncione a veia e instale o soro. Feito para jogar no celular.</p></section>
    <p class="sec-l">Escolha o nível</p>
    <div class="levels">${[['treino','Treino','Passo a passo com destaques'],['pratica','Prática','Só a fase atual'],['prova','Prova','Sem roteiro']].map(([k,t,d])=>`<button class="lvl ${LEVEL===k?'on':''}" data-l="${k}"><b>${t}</b><small>${d}</small></button>`).join('')}</div>
    <p class="sec-l">Escolha o procedimento</p>
    <div class="modes">
     <button class="mode on" data-m="soro"><span class="ic">${ICON.soro}</span><div><span class="tag">3 casos</span><h3>Soroterapia</h3><small>Conferência, equipo sem ar, punção e gotejamento.</small></div></button>
     <button class="mode" disabled><span class="ic">${ICON.ev}</span><div><span class="tag">em breve</span><h3>Endovenosa</h3><small>Diluição na sala de preparo e administração.</small></div></button>
     <button class="mode" disabled><span class="ic">${ICON.im}</span><div><span class="tag">em breve</span><h3>Intramuscular</h3><small>Troca de agulha, músculo e técnica.</small></div></button>
    </div>
    <button class="primary big" id="start">Começar plantão</button>
    <p class="foot">Conteúdo de preparo baseado na tabela da unidade. Valide com o enfermeiro responsável técnico e a farmácia antes do uso em sala. A prescrição médica e o protocolo institucional sempre prevalecem.</p>`);
  document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{LEVEL=b.dataset.l;document.querySelectorAll('.lvl').forEach(x=>x.classList.toggle('on',x===b));});
  $('#start').onclick=()=>startMode('soro');document.querySelector('[data-m="soro"]').onclick=()=>startMode('soro');}
$('#homeBtn').onclick=home;
home();

</script>
</body></html>
