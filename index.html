<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230E4A4F'/%3E%3Crect x='20' y='8' width='24' height='30' rx='8' fill='%23CFE6FA'/%3E%3Crect x='24' y='19' width='16' height='9' rx='3' fill='%23fff'/%3E%3Cpath d='M32 38v16' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"><link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230E4A4F'/%3E%3Crect x='20' y='8' width='24' height='30' rx='8' fill='%23CFE6FA'/%3E%3Crect x='24' y='19' width='16' height='9' rx='3' fill='%23fff'/%3E%3Cpath d='M32 38v16' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: app de celular em pé — topo fixo (prescrição + objetivo), cena do jogo no meio, gaveta de materiais no rodapé do canvas. No computador, vira uma "moldura de celular" centralizada. */
:root{
  color-scheme:light;
  --bg:#D7EFEC; --bg-2:#C3E6E1; --surface:#FFFFFF; --surface-2:#F0F7F7; --ink:#0F3238; --muted:#557178; --line:#CDE1E2;
  --accent:#12A58C; --accent-dark:#0B7564; --accent-ink:#FFFFFF; --accent-soft:#D3F1EA;
  --blue:#2D7FD3; --blue-dark:#1F5EA3; --amber:#E8962A; --amber-soft:#FFEFD6;
  --ok:#1E9A55; --ok-soft:#DCF5E5; --warn:#C27A00; --warn-soft:#FFF0CF; --bad:#D9403A; --bad-soft:#FDE1DE; --star:#FFC43D;
  --hud:#0E4A4F; --rx:#FFFDF4;
  --f-display:'Baloo 2','Trebuchet MS',sans-serif; --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(circle at 20% 0%,#E9F8F5 0,transparent 45%),radial-gradient(circle at 100% 100%,var(--bg-2) 0,transparent 50%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hud)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.05;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 8px}
@media (min-width:700px){#app{padding-block:16px;max-width:500px}}
body.playing .brand b,body.shift .brand b{display:none}
#menuBtn{display:none} body.shift #menuBtn,body.playing #menuBtn{display:inline-block} body.shift .brand,body.playing .brand{display:none}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{font-size:14px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--warn-soft);color:#7A4E00;box-shadow:inset 0 0 0 2px #F3D9A4}
.chip.ok{background:var(--ok-soft);color:var(--ok);box-shadow:none;text-decoration:line-through;text-decoration-thickness:1.5px}
body{margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding:8px 12px;margin-top:6px;background:var(--hud);color:#fff;border-radius:16px;box-shadow:0 4px 0 #082E31}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:#fff}
.brand svg{width:28px;height:28px}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:800;white-space:nowrap}
.top .sp{flex:1}
.pill{font-family:var(--f-display);font-size:15px;font-weight:700;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.14);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px;position:relative;white-space:nowrap}
.pill .st{color:var(--star)} .pill b{font-size:17px}
.ghost{background:var(--surface);border:0;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--line);color:var(--ink)}
.top .ghost{box-shadow:0 3px 0 #082E31;padding:6px 10px;font-size:13px}
.primary{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:12px 22px;font-weight:800;font-size:17px;box-shadow:0 4px 0 var(--accent-dark);font-family:var(--f-display)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dark)}
.primary.big{margin-top:16px;padding:14px 28px;font-size:19px;width:100%}
.primary.danger{background:var(--bad);box-shadow:0 4px 0 #8E2420}
.fly{position:absolute;right:4px;top:-8px;font-family:var(--f-display);font-weight:800;color:var(--star);font-size:20px;pointer-events:none;animation:fly 1s ease-out forwards;text-shadow:0 2px 0 #082E31}
.fly.neg{color:#FF8A84}
@keyframes fly{from{transform:translateY(0);opacity:1}to{transform:translateY(-30px);opacity:0}}
@keyframes pop{from{transform:scale(.94)}to{transform:none}}

/* início */
.hero{padding-block:22px 6px}
.hero h1{font-size:clamp(38px,11vw,54px)}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);font-size:16px;margin:10px 0 0}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:14px;font-weight:700;color:var(--amber)}
.sec-l{font-family:var(--f-display);font-weight:800;font-size:18px;margin:20px 0 8px}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{text-align:left;background:var(--surface);border:2px solid transparent;border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 0 var(--line)}
.mode.on{border-color:var(--accent);background:var(--accent-soft)}
.mode:disabled{opacity:.55;cursor:not-allowed}
.mode .ic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft)}
.mode .ic svg{width:42px;height:42px}
.mode div{min-width:0}
.mode h3{font-size:22px}
.mode small{color:var(--muted);font-size:14px;display:block;line-height:1.3}
.mode .tag{font-weight:800;font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:.06em}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl{background:var(--surface);border:2px solid transparent;border-radius:14px;padding:10px 8px;text-align:center;box-shadow:0 3px 0 var(--line);min-width:0}
.lvl b{display:block;font-family:var(--f-display);font-size:18px}
.lvl small{display:block;color:var(--muted);font-size:12px;line-height:1.25}
.lvl.on{border-color:var(--blue);background:#E3EEFB}

/* jogo */
#gamewrap{display:flex;flex-direction:column;gap:8px;margin-top:8px;flex:1;min-height:0}
.rxs{display:flex;align-items:center;gap:10px;background:var(--rx);border-radius:12px;padding:8px 10px;box-shadow:0 3px 0 #E5DCC4;text-align:left;border:0;width:100%}
.rxs .rxic{flex:none;width:34px;height:34px;border-radius:9px;background:var(--amber);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px}
.rxs .rxt{min-width:0;flex:1}
.rxs .rxp{font-weight:800;font-size:14.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rxs .rxl{font-family:var(--f-mono);font-size:13.5px;line-height:1.3;color:#5B4A1E}
.rxs .more{color:var(--muted);font-size:20px}
.obj{background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:0 3px 0 var(--line);display:flex;gap:10px;align-items:flex-start}
.obj .num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;box-shadow:inset 0 -3px 0 var(--blue-dark)}
.obj .txt{flex:1;min-width:0}
.obj .ph{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--amber)}
.obj .tt{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.1}
.obj .how{font-size:15px;color:var(--muted);margin-top:2px;line-height:1.3}
.obj .rbtn{flex:none;background:var(--surface-2);border:0;border-radius:10px;padding:6px 8px;font-weight:800;font-size:13.5px;box-shadow:0 2px 0 var(--line)}
.obj.flash{animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
.gstage{position:relative;flex:1;min-height:420px;border-radius:16px;overflow:hidden;background:#CDEAE5;box-shadow:0 4px 0 var(--line)}
#game{position:absolute;inset:0}
#game canvas{display:block;touch-action:none}
#gToast{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:4}
.gt{background:rgba(15,50,56,.93);color:#fff;padding:7px 12px;border-radius:12px;font-weight:700;font-size:15px;line-height:1.3;text-align:center;animation:pop .3s cubic-bezier(.3,1.6,.6,1);transition:opacity .4s;box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:100%}
.gt.ok{background:rgba(30,154,85,.95)} .gt.warn{background:rgba(194,122,0,.96)} .gt.bad{background:rgba(217,64,58,.96)} .gt.out{opacity:0}
.gt{display:flex;align-items:center;gap:8px;text-align:left}
.gt .gi{flex:none;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.gstage::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:16px;opacity:0;z-index:3}
.gstage.fl-bad::after{box-shadow:inset 0 0 0 6px var(--bad),inset 0 0 70px rgba(217,64,58,.55);animation:flash .65s ease-out}
.gstage.fl-warn::after{box-shadow:inset 0 0 0 5px var(--amber),inset 0 0 50px rgba(232,150,42,.45);animation:flash .6s ease-out}
.gstage.fl-ok::after{box-shadow:inset 0 0 0 5px var(--ok),inset 0 0 50px rgba(30,154,85,.35);animation:flash .6s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.pill.hit{animation:hit .6s ease-out}
@keyframes hit{0%{background:var(--bad);transform:scale(1.18)}100%{background:rgba(255,255,255,.14);transform:none}}
.prog{height:6px;border-radius:3px;background:var(--surface-2);margin-top:7px;overflow:hidden;box-shadow:inset 0 1px 0 var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#3CC7AF);border-radius:3px;transition:width .45s cubic-bezier(.3,1.4,.6,1)}
#hintBtn{color:var(--warn)}
.obj .phrow{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px}
.obj .phrow .rbtn{padding:3px 9px}
.obj{min-height:104px}
.ib{display:grid;place-items:center;width:34px;height:32px;padding:0!important}
.ib svg{width:20px;height:20px}
@media (max-width:420px){.brand b{font-size:15px}.top{gap:6px;padding:8px 10px}.top .ghost{padding:6px 8px}.pill{padding:2px 8px}}
.how2{margin:4px 0 0;padding-left:22px;font-size:15px} .how2 li{margin:8px 0}
.rec{display:inline-block;background:var(--star);color:#5A3B00;font-family:var(--f-display);font-weight:800;padding:2px 12px;border-radius:999px;animation:pop .45s cubic-bezier(.3,1.6,.6,1);box-shadow:0 3px 0 #D49A10}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-weight:700;font-size:14px;margin:0 0 12px}
.mode .best{display:block;margin-top:3px;font-size:12.5px;font-weight:800;color:var(--accent-dark)}
.mode .best .stars{font-size:14px;letter-spacing:1px}
.linkbtn{background:none;border:0;color:var(--blue-dark);font-weight:800;text-decoration:underline;padding:10px 0;width:100%}

/* roteiro (bottom sheet) */
#sheet{position:fixed;inset:0;z-index:30;background:rgba(10,40,44,.45);display:flex;align-items:flex-end;justify-content:center}
.sbox{background:var(--surface);width:100%;max-width:480px;max-height:80vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sbox h2{font-size:26px;margin-bottom:6px}
.fase{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--amber);margin:12px 0 4px}
.stp{display:flex;gap:10px;align-items:flex-start;padding:6px 0;color:var(--muted);font-weight:700;font-size:15px}
.stp i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-weight:800;font-size:14px;box-shadow:inset 0 -2px 0 var(--line)}
.stp.done{color:var(--ink)} .stp.done i{background:var(--accent);color:#fff;box-shadow:none}
.stp.now{color:var(--ink)} .stp.now i{background:var(--blue);color:#fff;box-shadow:none}
.stp small{display:block;font-weight:600;color:var(--muted);font-size:13px}

/* modal e cartões */
#modal{position:fixed;inset:0;z-index:40;background:rgba(10,40,44,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) max(14px,env(safe-area-inset-right,0px)) 20px max(14px,env(safe-area-inset-left,0px));overflow:auto}
.mbox{background:var(--surface);border-radius:20px;max-width:460px;width:100%;padding:18px;box-shadow:0 6px 0 var(--line);animation:pop .3s}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.mhead h2{font-size:26px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rx{background:var(--rx);border-radius:6px;padding:14px;font-family:var(--f-mono);font-size:14.5px;line-height:1.55;box-shadow:0 4px 0 #E5DCC4}
.rx h4{margin:0 0 8px;font-family:var(--f-display);font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px dashed #DCCFA8;padding-bottom:6px}
.rx .item{margin-top:10px;padding:8px 10px;background:var(--amber-soft);border-left:4px solid var(--amber);font-weight:500;border-radius:3px}
.rx dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px} .rx dt{color:var(--muted)} .rx dd{margin:0}
.pulseira{display:flex;align-items:stretch;border-radius:40px;background:linear-gradient(#FFFFFF,#E8F1F4);overflow:hidden;margin:6px 0 14px;box-shadow:0 4px 0 #C4D6DB}
.pulseira .clip{width:30px;background:linear-gradient(var(--blue),var(--blue-dark))}
.pulseira .pin{padding:10px 14px;font-family:var(--f-mono);font-size:13px;flex:1;min-width:0}
.pulseira .pin b{font-family:var(--f-body);font-size:16px;display:block;font-weight:800}
.alg{display:inline-block;margin-top:4px;font-weight:800;padding:1px 9px;border-radius:999px;font-family:var(--f-body);font-size:13px}
.alg.yes{background:var(--bad);color:#fff} .alg.no{background:var(--ok-soft);color:var(--ok)}
.unit{color:var(--muted);font-size:14px;font-weight:600}
.tbl-wrap{overflow-x:auto}
.ptbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;min-width:460px}
.ptbl th{font-family:var(--f-display);font-size:15px;text-transform:uppercase;background:var(--accent);color:#fff;padding:7px 8px;text-align:left}
.ptbl th.sec{background:var(--hud)}
.ptbl td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top;width:50%}
.ptbl td b{display:block} .ptbl td em{display:block;color:var(--muted);font-size:13px;font-style:normal}
.ptbl .rc{display:flex;gap:6px;align-items:baseline;margin-top:3px}
.ptbl .rc b{display:inline}
.ptbl .rc i{flex:none;font-style:normal;font-weight:800;font-size:11px;width:17px;height:17px;border-radius:50%;background:var(--amber);color:#fff;display:inline-grid;place-items:center;transform:translateY(-1px)}
.ptbl .po{color:var(--warn);font-weight:800}
.rbox{background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:13.5px;line-height:1.4}
.rbox h3{font-size:17px;margin-bottom:4px} .rbox p{margin:0 0 4px} .rbox ol{margin:4px 0 0;padding-left:20px} .rbox li{margin:2px 0}
.sum{background:var(--surface);border-radius:22px;padding:20px;margin-top:14px;box-shadow:0 5px 0 var(--line)}
.sum table{width:100%;border-collapse:collapse;font-size:14.5px}
.sum td{padding:8px 4px;border-bottom:2px solid var(--surface-2);font-weight:600}
.sum td.n{text-align:right;font-family:var(--f-display);font-weight:800;font-size:18px;white-space:nowrap}
.rev{margin:10px 0 0;padding-left:18px;font-size:14.5px} .rev li{margin:4px 0}
li.ok::marker{color:var(--ok)} li.warn::marker{color:var(--warn)} li.bad::marker{color:var(--bad)}
.stars{letter-spacing:2px;white-space:nowrap} .stars .on{color:var(--star);text-shadow:0 2px 0 #D49A10} .stars .off{color:#D6E0E1}
.bigstars{font-size:42px}
.score-big{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,20vw,100px);line-height:1;color:var(--accent)}
.foot{margin-top:24px;font-size:12px;color:var(--muted)}
body.playing #app{height:100dvh;min-height:0}
body.playing #gamewrap{flex:1;min-height:0}
/* toque no celular: sem realce azul, sem lupa/menu ao segurar, sem zoom por toque duplo nos botões */
button,a,.gstage{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.gstage{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.gload{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#CDEAE5;color:var(--hud);font-family:var(--f-display);font-weight:800;font-size:19px}
.gload i{width:46px;height:46px;border-radius:50%;border:5px solid rgba(14,74,79,.18);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ver{opacity:.7}
/* celulares baixos (ex.: 360×640): tudo cabe sem rolar a página */
@media (max-height:720px){body.playing .top{margin-top:4px;padding:6px 10px}#gamewrap{gap:6px;margin-top:6px}.gstage{min-height:280px}
  .obj{min-height:0;padding:8px 10px}.obj .num{width:34px;height:34px;font-size:16px}.obj .tt{font-size:17px}.obj .how{font-size:13px}
  .rxs{padding:6px 8px}.rxs .rxic{width:28px;height:28px;font-size:14px}.rxs .rxl{font-size:11.5px}}

/* ===== COMPUTADOR (tela larga, deitada): layout próprio em vez da moldura de celular =====
   coluna da esquerda: prescrição, passo atual, roteiro sempre aberto e atalhos; à direita, a cena do jogo na altura toda da janela */
.side{display:none}
@media (min-width:1000px) and (min-height:600px) and (orientation:landscape){
  #app{max-width:1000px;padding-inline:24px}
  .hero h1{font-size:56px} .hero p{font-size:18px;max-width:640px}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:14px} .mode[data-m="misto"]{grid-column:1/-1}
  .mode{padding:18px} .mode h3{font-size:24px} .mode small{font-size:15px}
  .levels{gap:12px} .lvl{padding:14px 10px} .lvl b{font-size:21px} .lvl small{font-size:14px}
  .primary.big{max-width:420px;display:block;margin-inline:auto}
  #view>.sum{max-width:760px;margin-inline:auto}

<script>
/* ---------- DADOS (transcritos da tabela da unidade) ---------- */
const D = {
  dipirona:{nome:'Dipirona',apres:'ampola',ev:{dil:'ABD',vol:20},im:{dil:'nenhum'},dose:'1 g (2 ml)',volIM:2,alergia:'Dipirona'},

  ceftriaxona:{nome:'Ceftriaxona',apres:'frasco',ev:{dil:'ABD',vol:20},im:{dil:'proprio'},dose:'1 g',volIM:3.5,
    imNota:'Para uso IM, a ceftriaxona tem apresentação própria (kit IM com diluente), que o paciente traz.'},
  hidrocortisona:{nome:'Hidrocortisona',apres:'frasco',ev:{dil:'ABD+SF',vol:20,bolsa:100,tempo:30,volInf:120},im:{dil:'ABD',vol:3,final:4},dose:'100 mg',volIM:4},
  biperideno:{nome:'Biperideno',apres:'ampola',ev:{dil:'nenhum'},im:{dil:'nenhum'},dose:'5 mg (1 ml)',volIM:1,
    imNota:'A tabela indica: somente a ampola, sem diluir, em 3 minutos.'},
  furosemida:{nome:'Furosemida',apres:'ampola',ev:{dil:'nenhum'},im:{dil:'nenhum'},dose:'20 mg (2 ml)',volIM:2},
  escopolamina:{nome:'Butilbrometo de escopolamina + dipirona sódica',curto:'Escopolamina + dipirona',apres:'ampola',ev:{dil:'SF',vol:250,tempo:60},im:{dil:'nenhum'},dose:'1 ampola (5 ml)',volIM:5,alergia:'Dipirona'},
  tramadol:{nome:'Tramadol',apres:'ampola',ev:{dil:'SF',vol:100,tempo:60},im:{dil:'nenhum'},dose:'100 mg (2 ml)',volIM:2,
    evNota:'Tramadol EV: gotejamento lento, de 30 minutos a 1 hora, para evitar efeitos colaterais.'},

    evNota:'Não é recomendado diluir o diazepam: pode precipitar (solução leitosa) e a diluição predispõe a tromboflebite.'},
  tiamina:{nome:'Tiamina',apres:'ampola',ev:{dil:'SF',vol:100,tempo:30},im:{dil:'nenhum'},dose:'100 mg (1 ml)',volIM:1},
  tiaminab12:{nome:'Tiamina + Complexo B12',apres:'ampola',ev:{dil:'SF',vol:250,tempo:60},dose:'3 amp. de tiamina + 1 amp. de complexo B12',
    evNota:'3 ampolas de tiamina + 1 ampola de complexo B12 em SF. Atente à prescrição médica para o volume.'},
  complexob12:{nome:'Complexo B12',apres:'ampola',im:{dil:'nenhum'},dose:'1 ampola (2 ml)',volIM:2},
  azitromicina:{nome:'Azitromicina',apres:'frasco',ev:{dil:'SF',vol:250,tempo:60},dose:'500 mg',evNota:'Azitromicina: somente endovenosa.'},
  amoxclav:{nome:'Amoxicilina + ácido clavulânico',curto:'Amoxicilina + clavulanato',apres:'frasco',ev:{dil:'SF',vol:100,tempo:30},dose:'1 g',alergia:'Penicilina',evNota:'Amoxicilina + clavulanato: somente endovenosa.'},
  prometazina:{nome:'Prometazina',apres:'ampola',im:{dil:'nenhum'},dose:'50 mg (2 ml)',volIM:2,imNota:'Prometazina: somente intramuscular.'},
  benzetacil:{nome:'Benzetacil (penicilina benzatina)',curto:'Benzetacil',apres:'frasco',im:{dil:'ABD',vol:3,final:4},dose:'1.200.000 UI',volIM:4,alergia:'Penicilina',viscoso:true,
    imNota:'Benzetacil: somente intramuscular.'}
};
const ROWS=[['dipirona','dipirona'],['tenoxicam','tenoxicam'],['dexametasona','dexametasona'],['metoclopramida','metoclopramida'],['ceftriaxona','ceftriaxona'],['hidrocortisona','hidrocortisona'],['biperideno','biperideno'],['furosemida','furosemida'],['escopolamina','escopolamina'],['tramadol','tramadol'],['diazepam','diazepam'],['tiamina','tiamina'],['tiaminab12','complexob12']];
const ROWS2=[['azitromicina','prometazina'],['amoxclav','benzetacil']];
const EV_SER=['dipirona','tenoxicam','dexametasona','metoclopramida','ceftriaxona','biperideno','furosemida','diazepam'];
const EV_BOL=['hidrocortisona','escopolamina','tramadol','tiamina','tiaminab12','azitromicina','amoxclav'];
const IMS=['dipirona','tenoxicam','dexametasona','metoclopramida','ceftriaxona','hidrocortisona','biperideno','furosemida','escopolamina','tramadol','diazepam','tiamina','complexob12','prometazina','benzetacil'];
/* ritmo do gotejamento por faixa: o que se cobra é lento/médio/rápido (o número aparece só como referência) */
const RITMO={macro:[40,62],micro:[120,186]},RITMO_N=['lento','médio','rápido'];
const ritmo=(r,micro)=>{const t=RITMO[micro?'micro':'macro'];return r<t[0]?0:r<=t[1]?1:2;};
const SOROS=[
  {sol:'SF 0,9%',vol:500,min:180,eq:'macro'},{sol:'SG 5%',vol:500,min:360,eq:'macro'},
  {sol:'Ringer lactato',vol:1000,min:360,eq:'macro'},{sol:'SF 0,9%',vol:1000,min:720,eq:'macro'},
  {sol:'SF 0,9%',vol:250,min:90,eq:'micro'},{sol:'SG 5%',vol:100,min:60,eq:'micro'},{sol:'Ringer lactato',vol:500,min:120,eq:'macro'}
];
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=n=>String(n).replace('.',',');
const tempoTxt=m=>m>=60?`${fmt(m/60)} h`:`${m} min`;
function descr(s){ if(!s) return '—';
  switch(s.dil){
    case 'nenhum': return 'Somente a ampola – sem diluir';
    case 'ABD': return `Diluir em ${s.vol} ml de ABD`+(s.final?` – volume final ${s.final} ml`:'');
    case 'SF': return `Diluir em ${s.vol} ml de SF 0,9%`;
    case 'ABD+SF': return `Diluir em ${s.vol} ml de ABD + ${s.bolsa} ml de SF 0,9%`;
    case 'proprio': return 'Apresentação própria – o paciente traz';
  }}
const nm=d=>d.curto||d.nome;

/* ---------- estado ---------- */
const S={run:0,score:0,cases:[],i:0,results:[],inCase:false,consultUsed:false,mode:null};

/* ---------- casos ---------- */
function makeCase(tipo){
  const p=makePatient(), leito=String(1+Math.floor(Math.random()*24)).padStart(2,'0');
  const c={tipo,p,leito,hora:pick(['08:00','10:00','14:00','16:00','20:00','22:00'])};
  if(tipo==='soro'){ c.soro=pick(SOROS); c.inf={vol:c.soro.vol,min:c.soro.min,eq:c.soro.eq}; c.via='EV'; }
  else{
    c.key=pick(POOL[tipo]); c.d=D[c.key];
    c.via=tipo==='im'?'IM':'EV'; c.spec=tipo==='im'?c.d.im:c.d.ev;
    if(tipo==='ev_bol') c.inf={vol:c.spec.volInf||c.spec.vol,min:c.spec.tempo,eq:'macro'};
  }
  c.queixa=tipo==='soro'?pick(QUEIXA_SORO):(QUEIXA[c.key]||'');
  return c;
}
function rxLine(c){
  if(c.tipo==='soro') return `${c.soro.sol} ${c.soro.vol} ml — EV — correr em ${tempoTxt(c.soro.min)} — equipo de ${c.soro.eq==='macro'?'macrogotas':'microgotas'}`;
  if(c.tipo==='ev_ser') return `${c.d.nome} ${c.d.dose} — EV lento — agora`;
  if(c.tipo==='ev_bol') return `${c.d.nome} ${c.d.dose}${c.key==='tiaminab12'?' em SF 0,9% 250 ml':''} — EV — correr em ${tempoTxt(c.spec.tempo)}`;
  return `${c.d.nome} ${c.d.dose} — IM — agora (volume a aplicar: ${fmt(c.d.volIM)} ml)`;
}


/* ---------- pacientes variados ---------- */
const NOMES_F=['Maria Aparecida','Ana Beatriz','Francisca','Juliana','Tereza Cristina','Luana','Rosângela','Camila','Edite','Patrícia','Benedita','Sônia Regina','Yasmin','Kelly Cristina','Iracema','Débora','Helena','Josefa','Marlene','Aline'];
const NOMES_M=['José Carlos','Antônio','Luiz Fernando','Raimundo Nonato','Pedro Henrique','Sebastião','Wellington','Marcos Vinícius','Francisco das Chagas','Kauê','João Batista','Rafael','Severino','Diego','Otávio','Cícero','Gabriel','Edson','Ricardo','Valdir'];
const SOBRE=[['Souza','Sousa'],['Lima','Lins'],['Ramos','Rocha'],['Ferreira da Silva','Pereira da Silva'],['de Oliveira Mota','de Oliveira Motta'],['Costa','Coutinho'],['Martins Rocha','Martins Rosa'],['Alves','Assis'],['Nascimento','Nogueira'],['Barbosa','Barbosa Neto'],['dos Santos','dos Anjos'],['Gonçalves','Guimarães'],['Carvalho','Carvalhal'],['Ribeiro','Ribas'],['Moreira','Moreno'],['Teixeira','Teixeira Filho']];
const PELE=[ // claro, médio, moreno, retinto
  {base:'#F7D2B6',mid:'#EDB792',dark:'#D9946D',line:'#C47C58',vein:'#6E82C9',vOp:.6},
  {base:'#EBB98F',mid:'#D99D6E',dark:'#BF7D4F',line:'#A8663D',vein:'#5D6FB2',vOp:.55},
  {base:'#C98B5E',mid:'#B07246',dark:'#8E5631',line:'#7A4728',vein:'#4E5E9A',vOp:.5},
  {base:'#8D5A3B',mid:'#744528',dark:'#58321C',line:'#452614',vein:'#3E4C82',vOp:.45}
];
const CABELO=['#2E1D13','#5A3A26','#8A5A2B','#C99A55','#1B1B1B','#B8B8B8','#E3E3E3'];
const QUEIXA={dipirona:'Febre e cefaleia',tenoxicam:'Dor lombar',dexametasona:'Crise alérgica',metoclopramida:'Náuseas e vômitos',ceftriaxona:'Infecção urinária',hidrocortisona:'Crise asmática',biperideno:'Reação extrapiramidal',furosemida:'Edema em membros inferiores',escopolamina:'Cólica abdominal',tramadol:'Dor pós-trauma',diazepam:'Crise de ansiedade intensa',tiamina:'Etilismo crônico',tiaminab12:'Etilismo crônico, desnutrição',complexob12:'Anemia por deficiência de B12',azitromicina:'Pneumonia',amoxclav:'Sinusite bacteriana',prometazina:'Reação alérgica e prurido',benzetacil:'Faringoamigdalite bacteriana'};
const QUEIXA_SORO=['Desidratação leve','Vômitos persistentes','Hidratação venosa','Diarreia aguda','Hipotensão leve'];
function makePatient(){
  const fem=Math.random()<.5, i=Math.floor(Math.random()*SOBRE.length);
  const idade=pick([19,23,27,31,36,42,47,53,58,63,68,72,77,81,86]);
  const nome=pick(fem?NOMES_F:NOMES_M);
  const ano=2026-idade, nasc=`${String(1+Math.floor(Math.random()*28)).padStart(2,'0')}/${String(1+Math.floor(Math.random()*12)).padStart(2,'0')}/${ano}`;
  const pele=Math.floor(Math.random()*PELE.length);
  let cab=idade>=68?pick([5,6]):pick([0,1,2,3,4]);
  return {n:`${nome} ${SOBRE[i][0]}`,alt:`${nome} ${SOBRE[i][1]}`,nasc,idade,fem,pele,cab,
    oculos:idade>=55&&Math.random()<.6, cabLongo:fem&&Math.random()<.75, barba:!fem&&Math.random()<.35,
    fragil:idade>=75, peso:pick([52,58,64,70,77,85,96])};
}

/* ---------- tabela de preparo ---------- */
/* frasco com pó: ml de ABD para reconstituir — os mesmos números que a sala de preparo cobra (recon, reconB e im.vol) */
const reconMl=(d,via)=>d.apres!=='frasco'?0:via==='ev'?(d.recon||d.reconB||0):(d.im&&d.im.dil==='ABD'?d.im.vol:0);
function prepSteps(d,via){const s=via==='ev'?d.ev:d.im,rc=reconMl(d,via);
  if(!rc) return descr(s);
  let n;
  if(via==='im') n=s.final?`Aspirar todo o conteúdo: volume final <b>${s.final} ml</b> (o pó ocupa volume)`:`Aspirar todo o conteúdo (${rc} ml), sem diluir mais`;
  else if(s.dil==='ABD') n=`Aspirar todo o conteúdo e completar com ABD até <b>${s.vol} ml</b> na seringa`;
  else n=`Aspirar todo o conteúdo e injetar na bolsa de <b>${bagVol(s)} ml de SF 0,9%</b>`;
  return `<span class="rc"><i>1</i><span>Reconstituir com <b>${rc} ml de ABD</b> e agitar até dissolver</span></span><span class="rc"><i>2</i><span>${n}</span></span>`;}
function cell(k,via){ if(!k) return '<td></td>'; const d=D[k],s=via==='ev'?d.ev:d.im; if(!s) return '<td></td>';
  const nota=via==='ev'?d.evNota:d.imNota,po=reconMl(d,via)>0;
  return `<td><b>${d.nome} <span style="font-weight:400;color:var(--muted)">(${d.apres}${po?' · <span class="po">pó</span>':''})</span></b>${prepSteps(d,via)}${nota&&!/somente (endo|intra)/i.test(nota)?`<em>${nota}</em>`:''}</td>`;}
const RECON_BOX=`<div class="rbox"><h3>Frasco com pó: reconstitua antes</h3>
  <p><b>Quando:</b> na sala de preparo, logo depois de abrir o frasco e antes de aspirar a dose. Reconstitua na hora de administrar, nunca com antecedência. Ampolas já vêm em solução e não se reconstituem.</p>
  <p><b>Como:</b></p><ol><li>Retire o lacre e desinfete a borracha com álcool 70%.</li>
  <li>Com a agulha 40 × 12, aspire o volume de ABD indicado na tabela (use ABD, não SF 0,9%).</li>
  <li>Injete o ABD no frasco, deixando escorrer pela parede.</li>
  <li>Agite em movimentos circulares até não restar pó.</li>
  <li>Aspire todo o conteúdo do frasco.</li>
  <li>Siga o passo <b>2</b> da tabela: completar a seringa, injetar na bolsa ou, na IM, trocar a agulha para aplicar.</li></ol></div>`;
function protoTable(){
  return `<div class="tbl-wrap"><table class="ptbl"><tr><th>Endovenosa</th><th>Intramuscular</th></tr>
   ${ROWS.map(([a,b])=>`<tr>${cell(a,'ev')}${cell(b,'im')}</tr>`).join('')}
   <tr><th class="sec">Somente endovenosa</th><th class="sec">Somente intramuscular</th></tr>
   ${ROWS2.map(([a,b])=>`<tr>${cell(a,'ev')}${cell(b,'im')}</tr>`).join('')}</table></div>`;
}

function evalSite(site,c){
  const v=c.d.volIM, ben=c.key==='benzetacil';
  if(ben){ if(site==='ventro') return [15,{ok:true,t:'Correto: penicilina benzatina vai na região glútea, com preferência pela ventroglútea.'}];
    if(site==='dorso') return [12,{ok:'warn',t:'Aceitável para penicilina benzatina, no quadrante superior externo. A ventroglútea é a preferencial.'}];
    return [0,{ok:false,t:'Penicilina benzatina (4 ml, suspensão viscosa) deve ser aplicada na região glútea, preferencialmente a ventroglútea.'}]; }
  if(site==='ventro') return [15,{ok:true,t:`Ventroglúteo: local mais seguro, longe de grandes vasos e nervos. Comporta os ${fmt(v)} ml.`}];
  if(site==='deltoide') return v<=2?[15,{ok:true,t:`Deltoide comporta até 2 ml em adultos; ${fmt(v)} ml está dentro do limite.`}]:[0,{ok:false,t:`O deltoide comporta até 2 ml em adultos. Para ${fmt(v)} ml, use ventroglúteo, dorsoglúteo ou vasto lateral.`}];
  if(site==='dorso') return [12,{ok:'warn',t:'Dorsoglúteo é aceito, mas somente no quadrante superior externo, pelo risco de lesão do nervo ciático. O ventroglúteo é preferível.'}];
  if(site==='vasto') return v<=4?[13,{ok:'warn',t:`Vasto lateral é uma boa opção para até 4 ml. O ventroglúteo segue como primeira escolha.`}]:[5,{ok:false,t:`${fmt(v)} ml é volume alto para o vasto lateral. Prefira a região ventroglútea.`}];
}

const DEFS=`<defs>

function svgTex(scene,key,[w,h,inner]){
  if(scene.textures.exists(key)) return Promise.resolve();
  return new Promise(res=>{const img=new Image();
    /* em tela de alta densidade a imagem é gerada em HIRES× e o quadro mantém o tamanho lógico (w×h), com a textura inteira (UV 0–1) */
    img.onload=()=>{if(!scene.textures.exists(key)){const tx=scene.textures.addImage(key,img);if(HIRES>1&&tx){const f=tx.get();f.setSize(w,h);f.setUVs(w,h,0,0,1,1);}}res();};
    img.onerror=()=>{console.warn('textura falhou',key);res();};
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(w*HIRES)}" height="${Math.round(h*HIRES)}" viewBox="0 0 ${w} ${h}">${DEFS}${inner}</svg>`);});
}
function baseTextures(scene){

    ['kit',ART.ampola('url(#gSaline)',false,'#12A58C')],['kitQ',ART.ampola('url(#gSaline)',true,'#12A58C')],['ampolaV',ART.ampola('none',true)],
    ['frasco',ART.frasco()],['frascoL',ART.frasco(true)],['bag',ART.bag()],['equipo',ART.equipo()],['equipoMi',ART.equipo(true)],
    ['gloves',ART.gloves()],['garroteRoll',ART.garroteRoll()],['alcool',ART.alcool()],['algodao',ART.algodao()],
    ['curativo',ART.curativo()],['extensor',ART.extensor()],['mandril',ART.mandril()],['cross',ART.cross()]];
  for(const g in CATS){L.push(['cat'+g,ART.cath(CATS[g].cor)]);L.push(['catIn'+g,ART.catIn(CATS[g].cor)]);}
  for(const k in NEEDLES){const n=NEEDLES[k];L.push(['nd_'+k,ART.needle(n.len,n.cal,n.cor)]);}
  return Promise.all(L.map(([k,a])=>svgTex(scene,k,a)));
}

function button(s,x,y,label,cb,{w=210,h=50,color=0x12A58C,dark=0x0B7564,size=19}={}){
  const g=s.add.graphics();

  const c=s.add.container(x,y,[g,t]).setSize(w,h+5).setInteractive({useHandCursor:true});
  c.on('pointerdown',()=>{draw(true);t.y=4;}); c.on('pointerout',()=>{draw(false);t.y=0;});

let _hsvg=null;
function samplePath(d,step,fx){
  if(!_hsvg){_hsvg=document.createElementNS('http://www.w3.org/2000/svg','svg');_hsvg.setAttribute('width','0');_hsvg.setAttribute('height','0');_hsvg.style.position='absolute';document.body.appendChild(_hsvg);}
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);_hsvg.appendChild(p);
  const L=p.getTotalLength(),pts=[];for(let l=0;l<=L;l+=step){const q=p.getPointAtLength(l);pts.push(fx(q.x,q.y));}p.remove();return pts;
}
function distToPolyline(x,y,pts){let m=1e9;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy||1;let t=((x-a.x)*dx+(y-a.y)*dy)/l2;t=Math.max(0,Math.min(1,t));const px=a.x+t*dx,py=a.y+t*dy;m=Math.min(m,Math.hypot(x-px,y-py));}return m;}

/* Passos com dependências: um passo só exige os que vêm antes dele de verdade.
   Passos do mesmo grupo (g) podem ser feitos em qualquer ordem; `after` define dependências explícitas ('*' = todos os outros). */
class Guide{
  constructor(scene,steps){this.s=scene;this.steps=steps.map(([f,id,t,how,view,o])=>({f,id,t,how,view,...(o||{})}));this.done=new Set();
    let last=[],gk=null,gDeps=[];const ids=this.steps.map(x=>x.id);
    this.steps.forEach((x,i)=>{let deps;
      if(x.g&&x.g===gk)deps=gDeps;else{deps=last;gk=x.g||null;gDeps=deps;}
      if(x.after)deps=x.after==='*'?ids.filter(k=>k!==x.id):x.after.filter(k=>ids.includes(k));
      x.deps=deps;last=x.g&&this.steps[i+1]&&this.steps[i+1].g===x.g?last:(x.g?this.steps.filter(y=>y.g===x.g).map(y=>y.id):[x.id]);});
    this.render();}
  step(id){return this.steps.find(x=>x.id===id);}
  isReady(x){return !this.done.has(x.id)&&x.deps.every(d=>this.done.has(d));}
  ready(){return this.steps.filter(x=>this.isReady(x));}
  /* passo em destaque: de preferência um disponível na vista atual (braço/suporte), para a câmera não pular */
  cur(){const r=this.ready(),v=this.s&&this.s.view;return r.find(x=>x.view&&x.view===v)||r[0]||this.steps.find(x=>!this.done.has(x.id));}

  missing(id,seen=new Set()){const x=this.step(id);if(!x||seen.has(id))return null;seen.add(id);
    for(const d of x.deps){if(!this.done.has(d))return this.missing(d,seen)||this.step(d);}return null;}
  can(id){const x=this.step(id);if(!x||this.done.has(id)||this.isReady(x))return true;
    if(LEVEL==='treino'){const m=this.missing(id)||this.cur();toast(`Primeiro: ${m.t}.`,'warn');this.bump();return false;}return true;}
  complete(id){if(this.done.has(id))return;const x=this.step(id);
    if(LEVEL!=='treino'&&x&&CUR){const miss=x.deps.filter(d=>!this.done.has(d)&&d!=='luvas'&&d!=='maos');

    sideRender(this);const rb=$('#rbtn');if(rb)rb.onclick=()=>this.sheet();const hb=$('#hintBtn');if(hb)hb.onclick=()=>this.hint();if(flash)this.bump();}

/* ---------- nitidez: o jogo pensa em 720×1120, mas o canvas desenha em RES× (tela de alta densidade) ----------
   O WebGL recebe um "tradutor" que multiplica viewport/scissor do quadro principal por RES; toque, posições e
   tamanhos continuam em 720×1120. Textos são rasterizados em RES× (resolution). Sem WebGL, cai no modo normal. */
const RES=(()=>{try{const dpr=window.devicePixelRatio||1,wide=matchMedia('(min-width:1000px) and (min-height:600px) and (orientation:landscape)').matches;
  const cssW=wide?(innerHeight-90)*GW/GH:Math.min(innerWidth-20,innerHeight*GW/GH);return Math.min(2,Math.max(1,Math.ceil(dpr*cssW/GW*4)/4));}catch(e){return 1;}})();

    if(k==='drawingBufferHeight')return Math.round(t.drawingBufferHeight/RES);
    if(k==='drawingBufferWidth')return Math.round(t.drawingBufferWidth/RES);
    if(k==='viewport')return cache.v||(cache.v=(x,y,w,h)=>fb?t.viewport(x,y,w,h):t.viewport(r(x),r(y),r(w),r(h)));
    if(k==='scissor')return cache.s||(cache.s=(x,y,w,h)=>fb?t.scissor(x,y,w,h):t.scissor(r(x),r(y),r(w),r(h)));
    if(k==='bindFramebuffer')return cache.b||(cache.b=(tg,f)=>{if(tg===t.FRAMEBUFFER)fb=f;t.bindFramebuffer(tg,f);});
    const v=t[k];return typeof v==='function'?(cache['f'+String(k)]||(cache['f'+String(k)]=v.bind(t))):v;}});}

  /* paciente errado = outra pessoa de verdade (outro nome, outra data, outra aparência), como acontece no plantão */
  if(r<.12){c.issue='outro';c.other=otherPatient(c.p);}
  else if(r<.15&&c.d){c.issue='alergia';c.alergiaW=c.d.alergia||c.d.nome;}
  /* ~30% dos pacientes têm uma alergia que NÃO conflita com o prescrito: é preciso ler, não só ver a cor */
  if(!c.issue&&Math.random()<.3)c.alergiaW=pick(ALERG_OK);
  return c;}
function otherPatient(p){for(let k=0;k<40;k++){const o=makePatient();const fn=x=>x.n.split(' ')[0];
    if(fn(o)!==fn(p)&&o.n.split(' ').pop()!==p.n.split(' ').pop()&&Math.abs(o.idade-p.idade)>=8&&(o.pele!==p.pele||o.cab!==p.cab||o.fem!==p.fem)){o.alergia=Math.random()<.3?pick(ALERG_OK):null;return o;}}
  const o=makePatient();o.alergia=null;return o;}
const ALERG_OK=['Sulfa','Iodo','Frutos do mar','Picada de abelha','Poeira e ácaros'];

async function playCase(c){

async function startMode(mode){const token=++S.run;S.mode=mode;S.results=[];

    ${bad.length?`<h3 style="font-size:20px">Para revisar</h3><ul class="rev">${bad.map(n=>`<li class="${n.ok==='warn'?'warn':'bad'}">${n.t}${n.pts?` <b style="color:var(--muted)">(${n.pts})</b>`:''}</li>`).join('')}</ul>`:'<p style="color:var(--ok);font-weight:800">Procedimento sem erros.</p>'}
    ${good.length?`<h3 style="font-size:20px;margin-top:14px">Acertos</h3><ul class="rev">${good.map(n=>`<li class="ok">${n.t}</li>`).join('')}</ul>`:''}
    <button class="primary big" id="nx">${last?'Ver resultado':'Próximo caso'}</button><button class="ghost" id="hm2" style="margin-top:12px;width:100%">Voltar ao menu</button></div>`);$('#hm2').onclick=askMenu;if(p>=90)sfx('win');$('#nx').onclick=res;});}
function finalSummary(){const pct=Math.round(S.results.reduce((a,r)=>a+caseScore(r),0)/S.results.length);$('#casePill').hidden=true;document.body.classList.remove('shift');$('#pts').textContent=pct;
